name: Build VESC Tool test versions

on:
  push:
  workflow_dispatch:

# A newer commit on the same branch makes older builds obsolete.
concurrency:
  group: test-builds-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows (Qt 5 / MinGW)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Qt 5 and MinGW
        uses: jurplel/install-qt-action@v4
        with:
          version: 5.15.2
          host: windows
          target: desktop
          arch: win64_mingw81
          tools: tools_mingw,qt.tools.win64_mingw810
          cache: true
          cache-key-prefix: qt-5.15.2-mingw81
          setup-python: false

      - name: Set dated output name
        id: output
        shell: bash
        run: echo "name=vesc_tool_test_windows_$(date -u +%F).exe" >> "$GITHUB_OUTPUT"

      - name: Build Windows application
        shell: bash
        run: ./build_local

      - name: Rename Windows executable
        shell: bash
        env:
          OUTPUT_NAME: ${{ steps.output.outputs.name }}
        run: |
          shopt -s nullglob
          executables=(build/win/vesc_tool*.exe)
          if ((${#executables[@]} != 1)); then
            echo "Expected exactly one VESC Tool executable, found ${#executables[@]}." >&2
            exit 1
          fi
          mv "${executables[0]}" "build/win/${OUTPUT_NAME}"

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.output.outputs.name }}
          path: build/win/
          if-no-files-found: error
          retention-days: 3

  build-android:
    name: Android ARM64 (Qt 5)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_PLATFORM: android-33
      ANDROID_NDK_VERSION: 21.4.7075529

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 8
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "8"

      - name: Install required Android SDK and NDK
        shell: bash
        run: |
          sdkmanager \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;33.0.2" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Install Qt 5 for Android
        uses: jurplel/install-qt-action@v4
        with:
          version: 5.15.2
          host: linux
          target: android
          arch: android
          cache: true
          cache-key-prefix: qt-5.15.2-android
          setup-python: false

      - name: Set dated output name
        id: output
        shell: bash
        run: echo "name=vesc_tool_test_android_$(date -u +%F).apk" >> "$GITHUB_OUTPUT"

      - name: Build Android application
        shell: bash
        env:
          VESC_ANDROID_OUTPUT_NAME: ${{ steps.output.outputs.name }}
        run: |
          export ANDROID_NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          ./build_android_local

      - name: Upload Android build
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.output.outputs.name }}
          path: build/android/${{ steps.output.outputs.name }}
          if-no-files-found: error
          retention-days: 3
          archive: false
